<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Highlights: 6 plus projects, 3 certifications, 2 internships, CGPA 3.60 out of 4.00">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#2563eb"><animate attributeName="stop-color" values="#2563eb;#7c3aed;#2563eb" dur="8s" repeatCount="indefinite"/></stop>
