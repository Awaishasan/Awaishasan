<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Awais Hassan — Flutter and Mobile App Developer banner">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#2563eb"><animate attributeName="stop-color" values="#2563eb;#7c3aed;#2563eb" dur="8s" repeatCount="indefinite"/></stop>
