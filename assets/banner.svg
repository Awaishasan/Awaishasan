<stop offset="100%" stop-color="#0d9488"><animate attributeName="stop-color" values="#0d9488;#2563eb;#0d9488" dur="8s" repeatCount="indefinite"/></stop>
</linearGradient>
</defs>
<style>
.fade{animation:fade 1.2s ease-out both}
