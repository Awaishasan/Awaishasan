<g class="fade"><rect x="610" y="20" width="275" height="170" rx="14" fill="#1e293b" stroke="url(#g)" stroke-width="2"/><text x="747" y="100" text-anchor="middle" font-size="46" font-weight="700" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">2</text><text x="747" y="140" text-anchor="middle" font-size="18" fill="#a5b4fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Internships</text></g>
